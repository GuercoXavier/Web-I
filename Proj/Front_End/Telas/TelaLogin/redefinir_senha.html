<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Redefinir Senha - BASGAM Tech">
    <title>Redefinir Senha - BASGAM Tech</title>
    <link rel="icon" type="image/jpg" href="../../imagens/logo.jpg">
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Esferas decorativas -->
    <div class="scene">
        <div class="sphere s4"></div>
        <div class="sphere s1"></div>
        <div class="sphere s2"></div>
        <div class="sphere s3"></div>
        <div class="sphere s5"></div>
        <div class="sphere s6"></div>
    </div>

    <div class="card">
        <div class="logo">
            <span>BASGAM Tech</span>
        </div>
        <h1>Redefinir Senha</h1>
        <p class="sub">Digite sua nova senha</p>

        <div class="campo">
            <label>Email</label>
            <input type="email" id="email" placeholder="teuemail@gmail.com">
        </div>

        <div class="campo">
            <label>Nova Senha</label>
            <div class="password-wrapper">
                <input type="password" id="novaSenha" placeholder="••••••">
                <i class='bx bx-show' onclick="toggleSenha('novaSenha', this)"></i>
            </div>
            <div class="senha-info" id="senhaInfo">
                <span id="lengthReq"><i class='bx bx-x'></i> 6+ caracteres</span>
                <span id="numberReq"><i class='bx bx-x'></i> Número</span>
                <span id="upperReq"><i class='bx bx-x'></i> Maiúscula</span>
            </div>
        </div>

        <div class="campo">
            <label>Confirmar Senha</label>
            <div class="password-wrapper">
                <input type="password" id="confirmarSenha" placeholder="••••••">
                <i class='bx bx-show' onclick="toggleSenha('confirmarSenha', this)"></i>
            </div>
        </div>

        <button class="btn" id="btnRedefinir">Redefinir Senha</button>

        <div class="links">
            <a href="tela_login.html">← Voltar ao login</a>
        </div>
    </div>

    <div id="toastContainer" class="toast-container"></div>

    <script src="login.js"></script>
</body>
</html>
