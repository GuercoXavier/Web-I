  <div class="container" id="container">

    <!-- Login -->
    <div class="form-box login">
      <form action="#">
        <h1>Login</h1>
        <div class="input-box">
          <input type="text" id="loginUsername" placeholder="Username" autocomplete="username" required>
          <i class='bx bxs-user'></i>
        </div>
        <div class="input-box">
          <input type="password" id="loginPassword" placeholder="Password" autocomplete="current-password" required>
          <i class='bx bxs-lock-alt'></i>
        </div>
        <div class="forget-link">
          <a href="./redefinir_senha.html">Esqueceu a senha?</a>
        </div>
        <button type="submit" class="btn">Entrar</button>
      </form>
    </div>

    <!-- Register -->
    <div class="form-box register">
      <form action="#">
        <h1>Registro</h1>
        <div class="input-box">
          <input type="text" id="registerUsername" placeholder="Username" autocomplete="username" required>
          <i class='bx bxs-user'></i>
        </div>
        <div class="input-box">
          <input type="email" id="registerEmail" placeholder="Email" autocomplete="email" required>
          <i class='bx bxs-envelope'></i>
        </div>
        <div class="input-box">
          <input type="password" id="registerPassword" placeholder="Password" autocomplete="new-password" required>
          <i class='bx bxs-lock-alt'></i>
        </div>
        <button type="submit" class="btn">Registar</button>
      </form>
    </div>

    <!-- Toggle -->
    <div class="toggle-box">
      <div class="toggle-panel toggle-left">
        <h1>Olá, bem-vindo!</h1>
        <p>Ainda não tem uma conta?</p>
        <button class="btn register-btn">Registar</button>
      </div>
      <div class="toggle-panel toggle-right">

        <p>Já tem uma conta?</p>
        <button class="btn login-btn">Login</button>

    </div>
