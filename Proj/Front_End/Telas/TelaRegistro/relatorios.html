<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BASGAM — Relatórios</title>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0a0a0a;
            --bg-panel: #141414;
            --borda: rgba(255,255,255,0.08);
            --texto: #d4d4d4;
            --muted: #6b7280;
            --branco: #ffffff;
            --azul: #3b82f6;
            --fonte-titulo: 'Syne', sans-serif;
            --fonte-corpo: 'DM Sans', sans-serif;
            --raio: 14px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: var(--fonte-corpo);
            background: var(--bg);
            color: var(--texto);
        }

        header {
            position: sticky;
            top: 0;
            height: 70px;
            padding: 0 40px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(10,10,10,0.92);
            backdrop-filter: blur(18px);
            border-bottom: 1px solid var(--borda);
        }

        .logo-badge {
            width: 38px;
            height: 38px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 9px;
            background: var(--branco);
            color: #0a0a0a;
            font-family: var(--fonte-titulo);
            font-weight: 800;
        }

        .header-esq { display: flex; align-items: center; gap: 18px; }
        .header-titulo { font-family: var(--fonte-titulo); font-size: 1.05rem; font-weight: 600; color: var(--branco); }
        .header-titulo span { color: var(--muted); }

        .container { max-width: 1200px; margin: 0 auto; padding: 40px 24px; }

        h1 { font-family: var(--fonte-titulo); font-size: 1.8rem; font-weight: 700; color: var(--branco); margin-bottom: 8px; }
        .sub { color: var(--muted); margin-bottom: 40px; }

        .cards-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 40px;
        }

        .card {
            background: var(--bg-panel);
            border: 1px solid var(--borda);
            border-radius: var(--raio);
            padding: 24px;
        }

        .card h3 { font-size: 0.75rem; text-transform: uppercase; color: var(--muted); margin-bottom: 8px; }
        .card .valor { font-family: var(--fonte-titulo); font-size: 2rem; font-weight: 800; color: var(--branco); }

        .filtros {
            background: var(--bg-panel);
            border: 1px solid var(--borda);
            border-radius: var(--raio);
            padding: 20px;
            margin-bottom: 32px;
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
            align-items: flex-end;
        }

        .filtro-group { display: flex; flex-direction: column; gap: 6px; }
        .filtro-group label { font-size: 0.7rem; text-transform: uppercase; color: var(--muted); }
        .filtro-group input {
            padding: 8px 12px;
            background: rgba(255,255,255,0.06);
            border: 1px solid var(--borda);
            border-radius: 8px;
            color: var(--branco);
        }

        .btn {
            padding: 8px 20px;
            background: var(--azul);
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
        }

        .btn:hover { background: #2563eb; }

        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid var(--borda); }
        th { color: var(--branco); background: rgba(255,255,255,0.04); }

        .top-produtos {
            margin-top: 40px;
            background: var(--bg-panel);
            border: 1px solid var(--borda);
            border-radius: var(--raio);
            padding: 24px;
        }

        .top-produtos h3 { margin-bottom: 20px; color: var(--branco); }
        .produto-item {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid var(--borda);
        }
        .produto-item:last-child { border-bottom: none; }

        @media (max-width: 700px) {
            header { padding: 0 20px; }
            .cards-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <header>
        <div class="header-esq">
            <div class="logo-badge">B</div>
            <span class="header-titulo">BASGAM <span>/ Relatórios</span></span>
        </div>
        <div>
            <a href="registroAdm.html" style="color:var(--muted); text-decoration:none;">← Voltar</a>
        </div>
    </header>

    <div class="container">
        <h1>📊 Relatório de Vendas</h1>
        <p class="sub">Visão geral das vendas e faturação</p>

        <div class="cards-grid" id="cardsResumo">
            <div class="card"><h3>Total de Vendas</h3><div class="valor" id="totalVendas">-</div></div>
            <div class="card"><h3>Faturação Total</h3><div class="valor" id="faturacaoTotal">-</div></div>
            <div class="card"><h3>Total Clientes</h3><div class="valor" id="totalClientes">-</div></div>
        </div>

        <div class="filtros">
            <div class="filtro-group">
                <label>Data Início</label>
                <input type="date" id="dataInicio">
            </div>
            <div class="filtro-group">
                <label>Data Fim</label>
                <input type="date" id="dataFim">
            </div>
            <div class="filtro-group">
                <label>&nbsp;</label>
                <button class="btn" onclick="carregarRelatorio()">🔍 Filtrar</button>
            </div>
        </div>

        <div style="overflow-x: auto;">
            <table>
                <thead>
                    <tr><th>ID</th><th>Data</th><th>Cliente</th><th>Total</th><th>Estado</th></tr>
                </thead>
                <tbody id="tabelaBody"><tr><td colspan="5">Carregando...</td></tr></tbody>
            </table>
        </div>

        <div class="top-produtos">
            <h3>🏆 Produtos Mais Vendidos</h3>
            <div id="topProdutos"></div>
        </div>
    </div>

    <script>
        const API_URL = 'http://localhost:3000/api';
        const token = localStorage.getItem('token');

        if (!token) {
            alert('Faça login primeiro!');
            window.location.href = '../TelaLogin/tela_login.html';
        }

        async function carregarRelatorio() {
            const dataInicio = document.getElementById('dataInicio').value;
            const dataFim = document.getElementById('dataFim').value;
            
            let url = `${API_URL}/pedidos/admin/relatorio?`;
            if (dataInicio) url += `&data_inicio=${dataInicio}`;
            if (dataFim) url += `&data_fim=${dataFim}`;
            
            try {
                const res = await fetch(url, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const data = await res.json();
                
                // Resumo
                document.getElementById('totalVendas').textContent = data.resumo?.total_vendas || 0;
                document.getElementById('faturacaoTotal').textContent = formatarMoeda(data.resumo?.faturacao_total || 0);
                document.getElementById('totalClientes').textContent = data.resumo?.total_clientes || 0;
                
                // Tabela de pedidos
                const tbody = document.getElementById('tabelaBody');
                if (!data.pedidos || !data.pedidos.length) {
                    tbody.innerHTML = '<tr><td colspan="5">Nenhum pedido encontrado</td></tr>';
                } else {
                    tbody.innerHTML = data.pedidos.map(p => `
                        <tr>
                            <td>#${p.pedido_id}</td>
                            <td>${new Date(p.criado_em).toLocaleDateString('pt-PT')}</td>
                            <td>${p.username || 'Anónimo'}</td>
                            <td>${formatarMoeda(p.total)}</td>
                            <td><span style="color:${p.estado === 'pendente' ? '#eab308' : '#22c55e'}">${p.estado}</span></td>
                        </tr>
                    `).join('');
                }
                
                // Top produtos
                const topDiv = document.getElementById('topProdutos');
                if (!data.top_produtos || !data.top_produtos.length) {
                    topDiv.innerHTML = '<p>Nenhum produto vendido ainda.</p>';
                } else {
                    topDiv.innerHTML = data.top_produtos.map(p => `
                        <div class="produto-item">
                            <span>${p.nome}</span>
                            <span><strong>${p.vendidos}</strong> vendidos | ${formatarMoeda(p.receita)}</span>
                        </div>
                    `).join('');
                }
                
            } catch (err) {
                console.error(err);
                document.getElementById('tabelaBody').innerHTML = '<tr><td colspan="5">Erro ao carregar</td></tr>';
            }
        }

        function formatarMoeda(valor) {
            return new Intl.NumberFormat('pt-PT', {
                style: 'currency',
                currency: 'MZN'
            }).format(valor);
        }

        carregarRelatorio();
    </script>
</body>
</html>
