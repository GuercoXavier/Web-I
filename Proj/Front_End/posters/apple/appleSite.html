<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EcoSistema da Apple</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Outfit:wght@300;400;500&display=swap" rel="stylesheet" />
  <!--appleSite.html-->
  <style>
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Bebas Neue', sans-serif;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }

    #applePoster {
      width: 100vw;
      height: 100vh;
      position: relative;
      overflow: hidden;
    }

    #fundo_Apple {
      position: absolute;
      inset: 0;
      background-image: url('../../imagens/poster/Apple/fundo_Apple.png');
      background-size: cover;
      background-position: center;
    }

    #fundo_Apple::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(
        105deg,
        rgba(0,0,0,0.78) 0%,
        rgba(0,0,0,0.55) 40%,
        rgba(0,0,0,0.10) 65%,
        transparent 100%
      );
    }

    .poster-content {
      position: relative;
      top: 90px;
      z-index: 20;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .texto-bloco {
      padding: clamp(32px, 5vh, 60px) clamp(40px, 6vw, 100px);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .etiqueta {

      font-weight: 500;
      font-size: clamp(13px, 1.4vw, 20px);
      letter-spacing: 4px;
      text-transform: uppercase;
      color: #FF6B00;
    }

    .titulo-principal {

      font-weight: 900;
      font-size: clamp(52px, 7.5vw, 112px);
      line-height: 0.92;
      color: #fff;
      text-transform: uppercase;
      letter-spacing: -1px;
    }

    .titulo-principal span { display: block; }

    .titulo-destaque {
      color: #FF6B00;
      font-style: italic;
    }

    .subtexto {
      margin-top: 20px;
      font-weight: 400;
      font-size: clamp(13px, 1.2vw, 18px);
      color: rgba(255,255,255,0.55);
      letter-spacing: 0.3px;
      max-width: 380px;
      line-height: 1.6;
    }


    /* ── PRODUTOS ── */
    .produtos-area {
      position: absolute;
      bottom: 0;
      right: 0;
      width: 100%;
      height: 92%;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      transform: translate(10%);
      z-index: 10;
    }

    .halo {
      position: absolute;
      bottom: -10%;
      left: 50%;
      transform: translateX(-50%);
      width: 90%;
      height: 80%;
      background: radial-gradient(ellipse at 50% 80%, rgba(255,100,0,0.28) 0%, transparent 70%);
      pointer-events: none;
    }

    /* Base compartilhada dos três produtos */
    .produto {
      position: absolute;
      object-fit: contain;
      align-self: flex-end;
      animation: float 5s ease-in-out infinite;
    }

    /* Cada produto sobrescreve só o que é único */
    #macbook {
      z-index: 2;
      left: -15vw;
      width: clamp(360px, 70vw, 70vw);
      margin-right: -5%;
      margin-bottom: -1%;
      filter: drop-shadow(-30px 40px 50px rgba(0,0,0,0.9));
      --dy: -16px;
    }

    #iphone {
      z-index: 4;
      width: clamp(200px, 100vw, 80vw);
      margin-bottom: -2%;
      filter: drop-shadow(0 30px 60px rgba(255,90,0,0.45));
      --dy: -22px;
      animation-delay: 0.6s;
    }

    #watch {
      z-index: 3;
      right: -9vw;
      width: clamp(190px, 100vw, 60vw);
      margin-left: -3%;
      margin-bottom: -3%;
      filter: drop-shadow(30px 40px 50px rgba(0,0,0,0.85));
      --dy: -12px;
      animation-delay: 1.2s;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50%       { transform: translateY(var(--dy, -16px)); }
    }

    /* ── ENTRADA ── */
    .poster-content > * { animation: fadeUp 0.9s cubic-bezier(.22,.6,.36,1) both; }
    .texto-bloco        { animation-delay: 0.1s; }
    .produtos-area      { animation-delay: 0.3s; }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(30px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ── BADGE ── */
    .badge-ecosistema {
      position: absolute;
      top: clamp(20px, 3vh, 40px);
      right: clamp(24px, 3vw, 56px);
      z-index: 20;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }

    .badge-ecosistema .linha {
      width: 1px;
      height: 36px;
      background: rgba(255,255,255,0.25);
    }

    .badge-ecosistema .texto-badge {
      font-weight: 500;
      font-size: 10px;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: rgba(255,255,255,0.4);
      writing-mode: vertical-rl;
    }
  </style>
</head>
<body>

  <div id="applePoster">

    <div id="fundo_Apple"></div>

    <div class="poster-content">
      <div class="texto-bloco">
        <p class="etiqueta">— EcoSistema da Apple</p>
        <h1 class="titulo-principal">
          <span>Criado pela</span>
          <span class="titulo-destaque">Apple.</span>
          <span>Criado para</span>
          <span>você.</span>
      </div>
    </div>

    <div class="produtos-area">
      <div class="halo"></div>
      <img src="../../imagens/poster/Apple/ult-macbook.png"    alt="MacBook Pro"  id="macbook" class="produto">
      <img src="../../imagens/poster/Apple/ult-iphone.png"     alt="iPhone 16"    id="iphone"  class="produto">
      <img src="../../imagens/poster/Apple/ult-AppleWatch.png" alt="Apple Watch"  id="watch"   class="produto">
    </div>

  </div>
</body>
</html>
