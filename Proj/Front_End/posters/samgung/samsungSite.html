<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Samsung</title>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Outfit:wght@300;400;500&display=swap" rel="stylesheet" />

        <style>
            *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

            :root {
            --cyan: #00d4ff;
            --bg: #06060f;
            }

            html, body {
            height: 100%;
            background: var(--bg);
            font-family: 'Outfit', sans-serif;
            color: #fff;
            overflow: hidden;
            }

            
            #poster {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            overflow: hidden;
            }

            
            #fundo {
            position: absolute;
            inset: 0;
            background-image: url('../../imagens/poster/samsung/samsungFundo.png');
            background-size: cover;
            background-position: center;
            z-index: 0;
            }
            #fundo::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(
                to right,
                rgba(6,6,15,0.96) 0%,
                rgba(6,6,15,0.72) 45%,
                rgba(6,6,15,0.20) 100%
            );
            }

            
            .content {
            position: relative;
            z-index: 5;
            width: 100%;
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 7vw;
            display: grid;
            grid-template-columns: minmax(0, 500px) 1fr;
            align-items: center;
            }

            
            .left { display: flex; flex-direction: column; }

            .brand {
            font-size: 0.70rem;
            font-weight: 400;
            letter-spacing: 0.38em;
            text-transform: uppercase;
            color: rgba(255,255,255,0.38);
            margin-bottom: clamp(1.6rem, 3vh, 2.4rem);
            display: inline-flex;
            align-items: center;
            gap: 0.7rem;
            }
            .brand::before {
            content: '';
            display: inline-block;
            width: 24px; height: 1px;
            background: var(--cyan);
            opacity: 0.6;
            }

            h1 {
            font-family: 'Bebas Neue', sans-serif;
            font-size: clamp(4.5rem, 9vw, 8.5rem);
            line-height: 0.90;
            letter-spacing: 0.01em;
            color: #fff;
            margin-bottom: clamp(1.4rem, 2.8vh, 2.2rem);
            }

            h1 em {
            font-style: normal;
            color: var(--cyan);
            animation: textGlow 3s ease-in-out infinite alternate;
            }
            @keyframes textGlow {
            from { text-shadow: 0 0 20px rgba(0,212,255,0.25), 0 0 40px rgba(0,212,255,0.10); }
            to   { text-shadow: 0 0 30px rgba(0,212,255,0.55), 0 0 70px rgba(0,212,255,0.22); }
            }

            .h1-line {
            display: block;
            height: 2px;
            width: 0;
            background: linear-gradient(to right, var(--cyan), transparent);
            margin-bottom: clamp(1.4rem, 2.8vh, 2.2rem);
            animation: lineExpand 0.8s 0.3s cubic-bezier(0.22,1,0.36,1) forwards;
            }
            @keyframes lineExpand {
            to { width: 180px; }
            }

            p.tag {
            font-size: clamp(0.88rem, 1.15vw, 1.02rem);
            font-weight: 300;
            line-height: 1.7;
            color: rgba(255,255,255,0.50);
            max-width: 340px;
            margin-bottom: clamp(2rem, 4vh, 3rem);
            }

            
            a.btn {
            display: flex;
            align-items: center;
            gap: 0.8rem;
            padding: 1rem 2rem;
            background: var(--cyan);
            color: #06060f;
            font-family: 'Outfit', sans-serif;
            font-size: 0.78rem;
            font-weight: 500;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            text-decoration: none;
            width: 100%;
            max-width: 500px;
            position: relative;
            overflow: hidden;
            clip-path: polygon(0 0, 100% 0, 96% 100%, 0 100%);
            transition: background 0.3s, color 0.3s, gap 0.3s;
            }
            a.btn:hover {
            background: #fff;
            color: #06060f;
            gap: 1.2rem;
            }
            a.btn svg { flex-shrink: 0; transition: transform 0.3s; }
            a.btn:hover svg { transform: translateX(4px); }

            /* ─── products column ─── */
            .products {
            position: relative;
            height: 100vh;
            pointer-events: none;
            }

            img.produto {
            position: absolute;
            object-fit: contain;
            }

            .phone-wrap {
            position: absolute;
            right: -1vw;
            top: 50%;
            transform: translateY(-50%);
            }

            
            @keyframes float {
            0%, 100% { transform: translate(0, 0);       }
            50%       { transform: translate(0, -18px);   }
            }

           
            @keyframes saidaTras {
            from { opacity: 1; transform: translate(0, 0);          }
            to   { opacity: 0; transform: translate(40vw, -60vh);   }
            }

            @keyframes saidaFrente {
            from { opacity: 1; transform: translate(0, 0);           }
            to   { opacity: 0; transform: translate(-20vw, -60vh);   }
            }

            @keyframes saidaPen {
            from { opacity: 1; transform: translate(0, 0);           }
            to   { opacity: 0; transform: translate(-20vw, 50vh);    }
            }

            
            @keyframes entradaTras {
            from { opacity: 0; transform: translate(40vw, -60vh);  }
            to   { opacity: 1; transform: translate(0, 0);          }
            }
            @keyframes entradaFrente {
            from { opacity: 0; transform: translate(-20vw, -60vh); }
            to   { opacity: 1; transform: translate(0, 0);          }
            }
            @keyframes entradaPen {
            from { opacity: 0; transform: translate(-20vw, 50vh);  }
            to   { opacity: 1; transform: translate(0, 0);          }
            }

            
            #samsung {
            position: relative;
            top: 25vh;
            height: clamp(60vh, 160vh, 160vh);
            filter: drop-shadow(0 40px 100px rgba(0,0,0,0.6))
                    drop-shadow(0 0 60px rgba(0,212,255,0.08));
            rotate: 310deg;
            opacity: 0;
            animation:
                entradaTras  0.9s  0.2s   cubic-bezier(0.22,1,0.36,1) forwards,
                float        4.5s  1.1s   ease-in-out                  infinite;
            }

            #sTras {
            position: relative;
            left: 70%;
            height: clamp(60vh, 160vh, 160vh);
            rotate: 310deg;
            opacity: 0;
            animation:
                entradaFrente 0.9s  1.0s  cubic-bezier(0.22,1,0.36,1) forwards,
                float         4.5s  1.1s  ease-in-out                  infinite;
            }

            #pen {
            rotate: 310deg;
            position: relative;
            top: -130vh;
            left: 10%;
            opacity: 0;
            animation:
                entradaPen  0.8s  1.8s  cubic-bezier(0.22,1,0.36,1) forwards,
                float       4.5s  1.1s  ease-in-out                  infinite;
            }

            
            @keyframes floatY {
                0%, 100% { transform: translateY(0); }
                50%      { transform: translateY(-20px); }
            }
            #earbuds {
            position: absolute;
            top: 0px;
            left: -80%;
            z-index: -30;
            height: clamp(160px, 60vh, 245vh);
            filter: drop-shadow(0 16px 40px rgba(0,0,0,0.5));
            animation: floatY 4s ease-in-out infinite;
            }

            #watch8 {
            position: absolute;
            top: 50vh;
            left: -70%;
            rotate: 90deg;
            height: clamp(160px, 60vh, 245vh);
            filter: drop-shadow(0 16px 40px rgba(0,0,0,0.5));
            z-index: -20;
            animation: floatY 5s ease-in-out infinite;
            }

            /* ─── bottom fine print ─── */
            .fine {
            position: absolute;
            bottom: 1.4rem;
            left: 7vw;
            font-size: 0.58rem;
            color: rgba(255,255,255,0.15);
            letter-spacing: 0.05em;
            z-index: 5;
            }

            /* ─── mobile ─── */
            @media (max-width: 780px) {
            .content { grid-template-columns: 1fr; }
            .products { display: none; }
            }
        </style>
    </head>
    <body>

    <div id="poster">
    <div id="fundo"></div>

    <div class="content">
        
        <div class="left">
        <span class="brand">Samsung · 2025</span>

        <h1>Conecte-se<br>ao <em>Futuro</em></h1>
        <span class="h1-line"></span>

        <p class="tag">Inovação que se sente a cada toque.<br>Tecnologia que vai além do que se vê.</p>

        <a href="#" class="btn">
            <span>Descobrir</span>
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round">
            <line x1="5" y1="12" x2="19" y2="12"/>
            <polyline points="12 5 19 12 12 19"/>
            </svg>
        </a>
        </div>
        <div class="products">
        <div class="phone-wrap">
            <div id="samsung_animar">
                <img src="../../imagens/poster/samsung/samsung_s26_tras.png" alt="samsung_s26_tras" id="samsung" class="produto"/>
                
            </div>
        </div>
        <img src="../../imagens/poster/samsung/samsung_s26_frente.png" alt="" id="sTras" class="produto">
        <img src="../../imagens/poster/samsung/samsung_pen.png" alt="" id="pen" class="produto">

        <img src="../../imagens/poster/samsung/earbuds-Photoroom.png" alt="Galaxy Earbuds" id="earbuds" class="produto"/>

        <img src="../../imagens/poster/samsung/galaxyWatch8.png" alt="Galaxy Watch 8" id="watch8" class="produto"/>
        

        </div>
    </div>

    </div>
    <script src="../../posters/posters.js"></script>
    </body>
</html>
